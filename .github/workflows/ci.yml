name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  MAX_EXE_BYTES: 1048576

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Size budget
        shell: pwsh
        run: |
          $size = (Get-Item target/release/slc.exe).Length
          "slc.exe: $size bytes"
          if ($size -gt [int]$env:MAX_EXE_BYTES) { throw "slc.exe exceeds the size budget ($env:MAX_EXE_BYTES bytes)" }
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process target/release/slc.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "slc.exe --version failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: slc-${{ github.sha }}
          path: target/release/slc.exe

  smoke:
    # End-to-end run on a Windows 10-based and a Windows 11 (24H2)-based image.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: slc-${{ github.sha }}
          path: artifact
      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke.ps1 -Exe artifact/slc.exe
