name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Check version matches tag
        shell: pwsh
        run: |
          $v = (Get-Item target/release/slc.exe).VersionInfo.ProductVersion
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Cargo version $v does not match tag ${{ github.ref_name }}" }
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/slc.exe dist/slc.exe
          $h = (Get-FileHash dist/slc.exe -Algorithm SHA256).Hash.ToLower()
          "$h  slc.exe" | Out-File -Encoding ascii dist/slc.exe.sha256
          "slc.exe: $((Get-Item dist/slc.exe).Length) bytes, sha256 $h"
      - name: Release notes
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $m = [regex]::Match($text, "(?s)## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=\n## \[|$)")
          ($m.Groups[1].Value.Trim()) | Out-File -Encoding utf8 dist/notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/slc.exe dist/slc.exe.sha256 --title "SLC ${{ github.ref_name }}" --notes-file dist/notes.md
